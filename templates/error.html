<!DOCTYPE html>
<html lang="ru" data-device="desktop">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{{ title }} — МастерДом</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#0f2f56" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0a111c" media="(prefers-color-scheme: dark)">

    {# Тот же приём, что на главной: тема ставится до первой отрисовки. #}
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('theme');
                if (saved === 'light' || saved === 'dark') {
                    document.documentElement.setAttribute('data-theme', saved);
                }
            } catch (error) { /* нет доступа к хранилищу — тема системная */ }
        })();
    </script>

    <link rel="stylesheet" href="{{ url_for('static', filename='fonts.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='img/favicon.svg') }}" type="image/svg+xml">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/apple-touch-icon.png') }}">
</head>
<body class="error-page">
    <main class="error-card">
        <a class="logo error-logo" href="{{ url_for('index') }}">
            <span class="logo-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
                </svg>
            </span>
            <span class="logo-text">
                <strong>МастерДом</strong>
                <small>сервисный центр</small>
            </span>
        </a>

        <p class="error-code">{{ code }}</p>
        <h1 class="error-title">{{ title }}</h1>
        <p class="error-text">{{ text }}</p>

        <div class="error-actions">
            <a href="{{ url_for('index') }}" class="btn btn-primary">На главную</a>
            <a href="tel:{{ phone_tel }}" class="btn btn-outline">{{ phone_display }}</a>
        </div>
    </main>
</body>
</html>
